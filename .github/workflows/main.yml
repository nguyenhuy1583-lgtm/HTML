name: Build HTML to APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Tải mã nguồn
        uses: actions/checkout@v4

      - name: Cài đặt Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cài đặt Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Đóng gói HTML bằng Capacitor
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "TenAppCuaBan" "com.custom.htmlapp" --web-dir=www
          npx cap add android

      - name: Biên dịch file APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Xuất file APK để tải về
        uses: actions/upload-artifact@v4
        with:
          name: My-Android-App-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
